# aqa agent on pull requests — copy to .github/workflows/aqa.yml in the target project.
#
#   label `aqa`           → derive test cases for the PR diff, commit them to the PR branch
#                           under .agents/aqa/pr-<number>/ and post the matrix as a comment
#   label `aqa:approved`  → a human approved the matrix: write the tests and commit them
#
# The review gate is the second label. The workflow, not the agent, records the approval,
# with the name of the person who applied the label.
#
# Requires the repository secret ANTHROPIC_API_KEY. Pull requests from forks are skipped:
# they have no access to secrets and must not get a writable token.
name: aqa

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aqa-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  AQA_REF: main                      # pin to a tag or commit of the aqa-agent repository
  SLUG: pr-${{ github.event.pull_request.number }}
  TOOLS: >-
    Read,Glob,Grep,Skill,Write,Edit,
    Bash(python3 *),Bash(git diff *),Bash(git status *),Bash(git log *),
    Bash(git worktree *),Bash(gh pr view *),Bash(gh pr diff *)

jobs:
  aqa:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'aqa' || github.event.label.name == 'aqa:approved')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code and the aqa plugin
        run: |
          npm install --global @anthropic-ai/claude-code
          git clone --depth 1 --branch "$AQA_REF" \
            https://github.com/inoob26/aqa-agent.git "$RUNNER_TEMP/aqa-agent"

      # Add the project's own setup here if the tests are to be run: uv sync, npm ci,
      # npx playwright install --with-deps, service containers, …

      - name: Derive test cases
        if: github.event.label.name == 'aqa'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          claude -p "Derive test cases for pull request #$PR (diff: git diff $BASE...HEAD; \
          description: gh pr view $PR). Use the slug '$SLUG'. Follow aqa-cases: write the \
          artifacts, leave the matrix as draft, write no test code. You are running \
          unattended: put every question for the reviewer into requirements.md." \
            --plugin-dir "$RUNNER_TEMP/aqa-agent" --agent aqa:aqa \
            --permission-mode acceptEdits --allowedTools "$TOOLS" \
            --max-budget-usd 5 --output-format json > "$RUNNER_TEMP/aqa.json"
          jq -r '.result' "$RUNNER_TEMP/aqa.json" > "$RUNNER_TEMP/reply.md"

      - name: Record the approval
        if: github.event.label.name == 'aqa:approved'
        env:
          APPROVER: ${{ github.event.sender.login }}
        run: |
          f=".agents/aqa/$SLUG/coverage.md"
          test -f "$f" || { echo "::error::$f not found — apply the 'aqa' label first"; exit 1; }
          sed -i -E \
            -e "0,/^status:.*/s//status: approved/" \
            -e "0,/^approved_by:.*/s//approved_by: $APPROVER (label aqa:approved)/" "$f"

      - name: Write the tests
        if: github.event.label.name == 'aqa:approved'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          claude -p "The matrix in .agents/aqa/$SLUG is approved. Follow aqa-generate, then \
          aqa-verify. Do not modify product code. If the test runner is not available in \
          this environment, say so in verification.md instead of guessing results." \
            --plugin-dir "$RUNNER_TEMP/aqa-agent" --agent aqa:aqa \
            --permission-mode acceptEdits --allowedTools "$TOOLS" \
            --max-budget-usd 10 --output-format json > "$RUNNER_TEMP/aqa.json"
          jq -r '.result' "$RUNNER_TEMP/aqa.json" > "$RUNNER_TEMP/reply.md"

      - name: Static checks on what the agent wrote
        if: github.event.label.name == 'aqa:approved'
        run: |
          lint="python3 $RUNNER_TEMP/aqa-agent/.agents/skills/aqa-verify/scripts/aqa_lint.py"
          git add --all --intent-to-add
          mapfile -t changed < <(git diff --name-only --diff-filter=AM HEAD)
          [ "${#changed[@]}" -eq 0 ] || $lint lint "${changed[@]}"
          $lint trace ".agents/aqa/$SLUG" "${changed[@]}"

      - name: Commit and comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
        run: |
          git config user.name "aqa-agent"
          git config user.email "aqa-agent@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "aqa: $([ "$LABEL" = aqa ] && echo 'test cases' || echo 'tests') for #$PR"
            git push
          fi
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/reply.md"
